<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order a Letter</title>
<link rel="icon" type="image/webp" href="assets/images/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Parisienne&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="order-letter">
 
<header>
  <div class="nav-row">
    <a class="logo" href="index.html" aria-label="Aurelis home">
      <img class="logo-img" src="assets/images/logo.webp" alt="" width="52" height="52">
      <span data-bind="site.brandName"></span>
    </a>
    <nav class="links" data-list="nav-links"></nav>
    <div class="nav-icons">
      <div class="search-wrap" id="searchWrap" role="search">
        <div class="search-field">
          <input type="text" id="searchInput" class="search-input" placeholder="Search products…" aria-label="Search products" autocomplete="off" enterkeyhint="search">
          <button type="button" class="icon-btn search-btn" id="searchToggle" aria-label="Search products" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          </button>
        </div>
      </div>
      <a class="icon-btn desk-only" href="mailto:aurelis2058@gmail.com" aria-label="Order enquiries">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-6.5 8-6.5s8 2.1 8 6.5"/></svg>
      </a>
      <a class="icon-btn desk-only" href="index.html#shop" aria-label="Go to shop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6.5 8h11l-1 12.5h-9L6.5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      </a>
      <a class="icon-btn desk-only" href="favorites.html" aria-label="View favorites">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20.5s-7.5-4.6-10-9.3C.4 8 1.6 4.3 5 3.2c2.3-.7 4.5.2 6 2.2 1.5-2 3.7-2.9 6-2.2 3.4 1.1 4.6 4.8 3 8-2.5 4.7-10 9.3-10 9.3z"/></svg>
        <span class="basket-count" data-role="favorites-count">0</span>
      </a>
      <a class="icon-btn desk-only" href="basket.html" aria-label="View basket">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2.5 3h2l2.6 12.4a2 2 0 002 1.6h8.4a2 2 0 002-1.6L21 8H6"/></svg>
        <span class="basket-count" data-role="basket-count">0</span>
      </a>
    </div>
  </div>
</header>

<!-- bottom navigation bar: shown on mobile only (see styles.css) -->
<nav class="bottom-nav" aria-label="Main">
  <div class="bottom-nav-inner">
    <a class="bnav-item" href="shop.html">
      <span class="bnav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6.5 8h11l-1 12.5h-9L6.5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      </span>
      <span class="bnav-label">Shop</span>
    </a>
    <a class="bnav-item" href="favorites.html">
      <span class="bnav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20.5s-7.5-4.6-10-9.3C.4 8 1.6 4.3 5 3.2c2.3-.7 4.5.2 6 2.2 1.5-2 3.7-2.9 6-2.2 3.4 1.1 4.6 4.8 3 8-2.5 4.7-10 9.3-10 9.3z"/></svg>
        <span class="basket-count" data-role="favorites-count">0</span>
      </span>
      <span class="bnav-label">Favorites</span>
    </a>
    <a class="bnav-item" href="index.html">
      <span class="bnav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-7.5 9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/></svg>
      </span>
      <span class="bnav-label">Home</span>
    </a>
    <a class="bnav-item" href="basket.html">
      <span class="bnav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2.5 3h2l2.6 12.4a2 2 0 002 1.6h8.4a2 2 0 002-1.6L21 8H6"/></svg>
        <span class="basket-count" data-role="basket-count">0</span>
      </span>
      <span class="bnav-label">Basket</span>
    </a>
    <a class="bnav-item" href="mailto:aurelis2058@gmail.com">
      <span class="bnav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-6.5 8-6.5s8 2.1 8 6.5"/></svg>
      </span>
      <span class="bnav-label">Account</span>
    </a>
  </div>
</nav>

<section class="order-hero">
  <div class="wrap">
    <h1 data-bind="order.heading"></h1>
    <p data-bind="order.intro"></p>
  </div>
</section>
 
<div class="order-wrap">
 
  <div class="order-form-section">
    <form id="order-form" novalidate>
 
      <div class="order-block">
        <h2>Your Letter</h2>
        <div class="order-items" data-list="order-items"></div>
      </div>
 
      <div class="order-block">
        <div class="basket-add-bar">
          <div class="basket-add-summary">
            <span>Subtotal</span>
            <span data-role="subtotal">$0.00</span>
          </div>
          <button type="submit" class="btn">Add to Basket</button>
        </div>
        <div id="form-msg" class="form-msg"></div>
      </div>
    </form>
  </div>
 
</div>
 
<footer>
  <div class="wrap">
    <div class="foot-grid">
      <div>
        <div class="foot-logo" data-bind="site.brandName"></div>
        <p data-bind="site.footerTagline"></p>
      </div>
      <div style="display:contents;" data-list="footer-columns"></div>
    </div>
    <div class="foot-bottom">
      <span>&copy; <span data-bind="site.copyrightText"></span></span>
      <div class="foot-legal" data-list="legal-links"></div>
    </div>
  </div>
</footer>
 
<script src="script.js"></script>
</body>
</html>
