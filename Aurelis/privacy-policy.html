<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Privacy Policy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Parisienne&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="privacy">

<header>
  <div class="nav-row">
    <div class="logo">
      <svg viewBox="0 0 40 40" fill="none"><path d="M20 20 C10 8, 2 12, 6 20 C2 28, 10 32, 20 20 C30 32, 38 28, 34 20 C38 12, 30 8, 20 20Z" stroke="#B46A72" stroke-width="2"/><circle cx="20" cy="20" r="3" fill="#B46A72"/></svg>
      <span data-bind="site.brandName"></span>
    </div>
    <nav class="links" data-list="nav-links"></nav>
    <div></div>
  </div>
</header>

<section class="legal-hero">
  <div class="wrap">
    <h1 data-bind="legal.heading"></h1>
    <div class="effective-date" data-bind="legal.effectiveDate"></div>
    <div class="legal-notice">
      Template notice: this page is a starting template for demonstration purposes only and is not legal advice.
      Replace every bracketed placeholder with your real business details and have this document reviewed by a
      qualified attorney before publishing it on a live site.
    </div>
  </div>
</section>

<section class="legal-body">
  <a class="back-link" href="index.html">Back to Shop</a>
  <div data-list="legal-sections"></div>
</section>

<footer>
  <div class="wrap">
    <div class="foot-grid">
      <div>
        <div class="foot-logo" data-bind="site.brandName"></div>
        <p data-bind="site.footerTagline"></p>
      </div>
      <div style="display:contents;" data-list="footer-columns"></div>
    </div>
    <div class="foot-bottom">
      <span>&copy; <span data-bind="site.copyrightText"></span></span>
      <div class="foot-legal" data-list="legal-links"></div>
    </div>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
