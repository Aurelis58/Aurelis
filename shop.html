<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.emailjs.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self';">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Shop All</title>
<link rel="icon" type="image/webp" href="assets/images/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Parisienne&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="shop">

<header>
  <div class="nav-row">
    <div class="logo">
      <img class="logo-img" src="assets/images/logo.webp" alt="" width="52" height="52">
      <span data-bind="site.brandName"></span>
    </div>
    <nav class="links" data-list="nav-links"></nav>
    <div class="nav-icons">
      <div class="search-wrap" id="searchWrap">
        <input type="text" id="searchInput" class="search-input" placeholder="Search products…" aria-label="Search products">
        <button type="button" class="icon-btn" id="searchToggle" aria-label="Search products" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </button>
      </div>
      <a class="icon-btn" href="mailto:aurelis2058@gmail.com" aria-label="Order enquiries">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-6.5 8-6.5s8 2.1 8 6.5"/></svg>
      </a>
      <a class="icon-btn" href="shop.html" aria-label="Go to shop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6.5 8h11l-1 12.5h-9L6.5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      </a>
      <a class="icon-btn" href="favorites.html" aria-label="View favorites">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20.5s-7.5-4.6-10-9.3C.4 8 1.6 4.3 5 3.2c2.3-.7 4.5.2 6 2.2 1.5-2 3.7-2.9 6-2.2 3.4 1.1 4.6 4.8 3 8-2.5 4.7-10 9.3-10 9.3z"/></svg>
        <span class="basket-count" data-role="favorites-count">0</span>
      </a>
      <a class="icon-btn" href="basket.html" aria-label="View basket">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2.5 3h2l2.6 12.4a2 2 0 002 1.6h8.4a2 2 0 002-1.6L21 8H6"/></svg>
        <span class="basket-count" data-role="basket-count">0</span>
      </a>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<section class="order-hero">
  <div class="wrap">
    <a class="back-link" href="index.html">&larr; Back to Main Menu</a>
    <h1 data-bind="shop.heading"></h1>
    <p data-bind="shop.intro"></p>
  </div>
</section>

<!-- ===================== CATEGORIES ===================== -->
<section class="categories" style="padding:60px 0 0;">
  <div class="wrap">
    <div class="cat-float-card" style="margin-top:0;">
      <div class="sec-head cat-sec-head">
        <span class="eyebrow" data-bind="categoriesSection.eyebrow"></span>
        <h2 data-bind="categoriesSection.heading"></h2>
      </div>
      <div class="cat-grid" data-list="categories"></div>
    </div>
  </div>
</section>

<!-- ===================== FULL PRODUCT GRID ===================== -->
<section class="products">
  <div class="wrap">
    <div class="sec-head">
      <span class="eyebrow" data-bind="productsSection.eyebrow"></span>
      <h2 data-bind="productsSection.heading"></h2>
    </div>
    <div class="shop-filters" data-list="shop-filters" role="tablist" aria-label="Filter products by category"></div>
    <div class="product-grid" data-list="products"></div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="foot-grid">
      <div>
        <div class="foot-logo" data-bind="site.brandName"></div>
        <p data-bind="site.footerTagline"></p>
        <div class="foot-socials" style="margin-top:20px;">
          <a href="https://www.instagram.com/aurelis_craft/" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg></a>
        </div>
      </div>
      <div style="display:contents;" data-list="footer-columns"></div>
    </div>
    <div class="foot-bottom">
      <span>&copy; <span data-bind="site.copyrightText"></span></span>
      <div class="foot-legal" data-list="legal-links"></div>
    </div>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
