<!DOCTYPE html>

<!--
  Content-Security-Policy: this covers what index.html itself loads (Google Fonts)
  plus what script.js needs site-wide (EmailJS's API + SDK, jsPDF for the receipt PDF).
  script-src/style-src include 'unsafe-inline' because this site uses inline onclick=""
  handlers and inline style="" attributes in generated HTML — CSP still blocks any
  <script>/<link> pulled from an origin not listed here, which is the main protection
  against a stray injected remote script. If your order pages load EmailJS or jsPDF
  from a different CDN than cdn.jsdelivr.net / cdnjs.cloudflare.com, add that origin too.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.emailjs.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self';">
<meta name="referrer" content="strict-origin-when-cross-origin">

<!-- ===================== HERO (static) ===================== -->
<div class="hero slide1">
  <div class="wrap">
    <div class="slide-text">
      <span class="eyebrow" data-bind="hero.slides.0.eyebrow"></span>
      <h1 data-bind="hero.slides.0.heading"></h1>
      <p data-bind="hero.slides.0.body"></p>
      <a class="btn" data-bind="hero.slides.0.ctaText" data-bind-href="hero.slides.0.ctaHref"></a>
    </div>
    <div class="hero-art">
      <img data-bind-src="hero.slides.0.image" data-bind-alt="hero.slides.0.imageAlt" alt="">
    </div>
  </div>
</div>

<!-- ===================== CATEGORIES (floating over hero) ===================== -->
<section class="categories" id="shop">
  <div class="wrap">
    <div class="cat-float-card">
      <div class="sec-head cat-sec-head">
        <span class="eyebrow" data-bind="categoriesSection.eyebrow"></span>
        <h2 data-bind="categoriesSection.heading"></h2>
      </div>
      <div class="cat-grid" data-list="categories"></div>
    </div>
  </div>
</section>

<!-- ===================== TRUST STRIP ===================== -->
<div class="trust">
  <div class="wrap" data-list="trust"></div>
</div>

<!-- ===================== PRODUCTS ===================== -->
<section class="products" id="crochet">
  <div class="wrap">
    <div class="sec-head sec-head-row">
      <div>
        <span class="eyebrow" data-bind="productsSection.eyebrow"></span>
        <h2 data-bind="productsSection.heading"></h2>
      </div>
      <a class="view-all" data-bind="productsSection.viewAllText" data-bind-href="productsSection.viewAllHref"></a>
    </div>
    <div class="product-grid" data-list="products"></div>
  </div>
</section>

<!-- ===================== THE RITUAL / OUR PROMISE ===================== -->
<section class="promo" id="about">
  <div class="wrap">

      <span class="eyebrow" data-bind="ritual.eyebrow"></span>
      <h2 data-bind="ritual.heading"></h2>
      <p data-bind="ritual.body"></p>
      <a class="btn outline" data-bind="ritual.ctaText" data-bind-href="ritual.ctaHref"></a>

      <img data-bind-src="ritual.image" data-bind-alt="ritual.imageAlt" alt="">
    </div>
  </div>
</section>

<section class="promise">
  <div class="wrap">
    <div class="sec-head">
      <span class="eyebrow" data-bind="promiseSection.eyebrow"></span>
      <h2 data-bind="promiseSection.heading"></h2>
    </div>
    <div class="promise-grid">
      <div class="promise-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
        <div>
          <strong data-bind="promiseSection.items.0.title"></strong>
          <span data-bind="promiseSection.items.0.text"></span>
        </div>
      </div>
      <div class="promise-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
        <div>
          <strong data-bind="promiseSection.items.1.title"></strong>
          <span data-bind="promiseSection.items.1.text"></span>
        </div>
      </div>
      <div class="promise-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
        <div>
          <strong data-bind="promiseSection.items.2.title"></strong>
          <span data-bind="promiseSection.items.2.text"></span>
        </div>
      </div>
    </div>
  </div>
</section>
