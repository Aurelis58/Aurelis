<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  Content-Security-Policy: this covers what index.html itself loads (Google Fonts)
  plus what script.js needs site-wide (EmailJS's API + SDK, jsPDF for the receipt PDF).
  script-src/style-src include 'unsafe-inline' because this site uses inline onclick=""
  handlers and inline style="" attributes in generated HTML — CSP still blocks any
  <script>/<link> pulled from an origin not listed here, which is the main protection
  against a stray injected remote script. If your order pages load EmailJS or jsPDF
  from a different CDN than cdn.jsdelivr.net / cdnjs.cloudflare.com, add that origin too.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.emailjs.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self';">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Handmade Crochet, Ribbon and Craft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Parisienne&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="home">

<header>
  <div class="nav-row">
    <div class="logo">
      <svg viewBox="0 0 40 40" fill="none"><path d="M20 20 C10 8, 2 12, 6 20 C2 28, 10 32, 20 20 C30 32, 38 28, 34 20 C38 12, 30 8, 20 20Z" stroke="#B46A72" stroke-width="2"/><circle cx="20" cy="20" r="3" fill="#B46A72"/></svg>
      <span data-bind="site.brandName"></span>
    </div>
    <nav class="links" data-list="nav-links"></nav>
    <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<!-- ===================== HERO CAROUSEL ===================== -->
<div class="hero">
  <div class="slides" id="slides">

    <div class="slide slide1">
      <div class="wrap">
        <div class="slide-text">
          <span class="eyebrow" data-bind="hero.slides.0.eyebrow"></span>
          <h1 data-bind="hero.slides.0.heading"></h1>
          <p data-bind="hero.slides.0.body"></p>
          <a class="btn" data-bind="hero.slides.0.ctaText" data-bind-href="hero.slides.0.ctaHref"></a>
        </div>
        <div class="hero-art">
          <img data-bind-src="hero.slides.0.image" data-bind-alt="hero.slides.0.imageAlt" alt="">
        </div>
      </div>
    </div>

    <div class="slide slide2">
      <div class="wrap">
        <div class="slide-text">
          <span class="eyebrow" data-bind="hero.slides.1.eyebrow"></span>
          <h1 data-bind="hero.slides.1.heading"></h1>
          <p data-bind="hero.slides.1.body"></p>
          <a class="btn outline" data-bind="hero.slides.1.ctaText" data-bind-href="hero.slides.1.ctaHref"></a>
        </div>
        <div class="hero-art">
          <img data-bind-src="hero.slides.1.image" data-bind-alt="hero.slides.1.imageAlt" alt="">
        </div>
      </div>
    </div>

    <div class="slide slide3">
      <div class="wrap">
        <div class="slide-text">
          <span class="eyebrow" data-bind="hero.slides.2.eyebrow"></span>
          <h1 data-bind="hero.slides.2.heading"></h1>
          <p data-bind="hero.slides.2.body"></p>
          <a class="btn" data-bind="hero.slides.2.ctaText" data-bind-href="hero.slides.2.ctaHref"></a>
        </div>
        <div class="hero-art">
          <img data-bind-src="hero.slides.2.image" data-bind-alt="hero.slides.2.imageAlt" alt="">
        </div>
      </div>
    </div>

  </div>

  <button type="button" class="hero-nav-btn prev" onclick="moveSlide(-1)" aria-label="Previous slide">
    <svg viewBox="0 0 24 24" fill="none" stroke="#2D3A47" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <button type="button" class="hero-nav-btn next" onclick="moveSlide(1)" aria-label="Next slide">
    <svg viewBox="0 0 24 24" fill="none" stroke="#2D3A47" stroke-width="2" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
  </button>

  <div class="dots">
    <button type="button" class="dot active" onclick="goToSlide(0)" aria-label="Show slide 1"><svg viewBox="0 0 26 14" aria-hidden="true"><path d="M13 12C4 12 2 2 8 2c4 0 5 4 5 4s1-4 5-4c6 0 4 10-5 10Z" fill="#B46A72"/></svg></button>
    <button type="button" class="dot" onclick="goToSlide(1)" aria-label="Show slide 2"><svg viewBox="0 0 26 14" aria-hidden="true"><path d="M13 12C4 12 2 2 8 2c4 0 5 4 5 4s1-4 5-4c6 0 4 10-5 10Z" fill="#B46A72"/></svg></button>
    <button type="button" class="dot" onclick="goToSlide(2)" aria-label="Show slide 3"><svg viewBox="0 0 26 14" aria-hidden="true"><path d="M13 12C4 12 2 2 8 2c4 0 5 4 5 4s1-4 5-4c6 0 4 10-5 10Z" fill="#B46A72"/></svg></button>
  </div>
</div>

<!-- ===================== TRUST STRIP ===================== -->
<div class="trust">
  <div class="wrap" data-list="trust"></div>
</div>

<!-- ===================== CATEGORIES ===================== -->
<section class="categories" id="shop">
  <div class="wrap">
    <div class="sec-head">
      <span class="eyebrow" data-bind="categoriesSection.eyebrow"></span>
      <h2 data-bind="categoriesSection.heading"></h2>
      <svg class="ribbon-underline" viewBox="0 0 150 14"><path d="M2 8c15 -12 30 8 40 -2s25 -10 35 0 25 8 35 -2 25 6 35 -2"/></svg>
    </div>
    <div class="cat-grid" data-list="categories"></div>
  </div>
</section>

<!-- ===================== PRODUCTS ===================== -->
<section class="products" id="crochet">
  <div class="wrap">
    <div class="sec-head">
      <span class="eyebrow" data-bind="productsSection.eyebrow"></span>
      <h2 data-bind="productsSection.heading"></h2>
      <svg class="ribbon-underline" viewBox="0 0 150 14"><path d="M2 8c15 -12 30 8 40 -2s25 -10 35 0 25 8 35 -2 25 6 35 -2"/></svg>
    </div>
    <div class="product-grid" data-list="products"></div>
  </div>
</section>

<!-- ===================== FOOTER ===================== -->
<footer>
  <div class="wrap">
    <div class="foot-grid">
      <div>
        <div class="foot-logo" data-bind="site.brandName"></div>
        <p data-bind="site.footerTagline"></p>
        <div class="foot-socials" style="margin-top:20px;">
          <a href="https://www.instagram.com/aurelis_craft/" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg></a>
        </div>
      </div>
      <div style="display:contents;" data-list="footer-columns"></div>
    </div>
    <div class="foot-bottom">
      <span>&copy; <span data-bind="site.copyrightText"></span></span>
      <div class="foot-legal" data-list="legal-links"></div>
    </div>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
