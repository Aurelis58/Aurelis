<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handmade Crochet, Ribbon and Craft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Parisienne&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="home">

<header>
  <div class="nav-row">
    <div class="logo">
      <svg viewBox="0 0 40 40" fill="none"><path d="M20 20 C10 8, 2 12, 6 20 C2 28, 10 32, 20 20 C30 32, 38 28, 34 20 C38 12, 30 8, 20 20Z" stroke="#B46A72" stroke-width="2"/><circle cx="20" cy="20" r="3" fill="#B46A72"/></svg>
      <span data-bind="site.brandName"></span>
    </div>
    <nav class="links" data-list="nav-links"></nav>
    <div class="nav-icons">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M12 21s-8-4.6-8-11a4.8 4.8 0 018-3.6A4.8 4.8 0 0120 10c0 6.4-8 11-8 11z"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L5 3H2"/><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg>
    </div>
  </div>
</header>

<!-- ===================== HERO CAROUSEL ===================== -->
<div class="hero">
  <div class="slides" id="slides">

    <div class="slide slide1">
      <div class="wrap">
        <div class="slide-text">
          <span class="eyebrow" data-bind="hero.slides.0.eyebrow"></span>
          <h1 data-bind="hero.slides.0.heading"></h1>
          <p data-bind="hero.slides.0.body"></p>
          <a class="btn" data-bind="hero.slides.0.ctaText" data-bind-href="hero.slides.0.ctaHref"></a>
        </div>
        <div class="hero-art">
          <img data-bind-src="hero.slides.0.image" data-bind-alt="hero.slides.0.imageAlt" alt="">
        </div>
      </div>
    </div>

    <div class="slide slide2">
      <div class="wrap">
        <div class="slide-text">
          <span class="eyebrow" data-bind="hero.slides.1.eyebrow"></span>
          <h1 data-bind="hero.slides.1.heading"></h1>
          <p data-bind="hero.slides.1.body"></p>
          <a class="btn outline" data-bind="hero.slides.1.ctaText" data-bind-href="hero.slides.1.ctaHref"></a>
        </div>
        <div class="hero-art">
          <img data-bind-src="hero.slides.1.image" data-bind-alt="hero.slides.1.imageAlt" alt="">
        </div>
      </div>
    </div>

    <div class="slide slide3">
      <div class="wrap">
        <div class="slide-text">
          <span class="eyebrow" data-bind="hero.slides.2.eyebrow"></span>
          <h1 data-bind="hero.slides.2.heading"></h1>
          <p data-bind="hero.slides.2.body"></p>
          <a class="btn" data-bind="hero.slides.2.ctaText" data-bind-href="hero.slides.2.ctaHref"></a>
        </div>
        <div class="hero-art">
          <img data-bind-src="hero.slides.2.image" data-bind-alt="hero.slides.2.imageAlt" alt="">
        </div>
      </div>
    </div>

  </div>

  <div class="hero-nav-btn prev" onclick="moveSlide(-1)" role="button" aria-label="Previous slide">
    <svg viewBox="0 0 24 24" fill="none" stroke="#2D3A47" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
  </div>
  <div class="hero-nav-btn next" onclick="moveSlide(1)" role="button" aria-label="Next slide">
    <svg viewBox="0 0 24 24" fill="none" stroke="#2D3A47" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
  </div>

  <div class="dots">
    <div class="dot active" onclick="goToSlide(0)" role="button" aria-label="Show slide 1"><svg viewBox="0 0 26 14"><path d="M13 12C4 12 2 2 8 2c4 0 5 4 5 4s1-4 5-4c6 0 4 10-5 10Z" fill="#B46A72"/></svg></div>
    <div class="dot" onclick="goToSlide(1)" role="button" aria-label="Show slide 2"><svg viewBox="0 0 26 14"><path d="M13 12C4 12 2 2 8 2c4 0 5 4 5 4s1-4 5-4c6 0 4 10-5 10Z" fill="#B46A72"/></svg></div>
    <div class="dot" onclick="goToSlide(2)" role="button" aria-label="Show slide 3"><svg viewBox="0 0 26 14"><path d="M13 12C4 12 2 2 8 2c4 0 5 4 5 4s1-4 5-4c6 0 4 10-5 10Z" fill="#B46A72"/></svg></div>
  </div>
</div>

<!-- ===================== TRUST STRIP ===================== -->
<div class="trust">
  <div class="wrap" data-list="trust"></div>
</div>

<!-- ===================== CATEGORIES ===================== -->
<section class="categories" id="shop">
  <div class="wrap">
    <div class="sec-head">
      <span class="eyebrow" data-bind="categoriesSection.eyebrow"></span>
      <h2 data-bind="categoriesSection.heading"></h2>
      <svg class="ribbon-underline" viewBox="0 0 150 14"><path d="M2 8c15 -12 30 8 40 -2s25 -10 35 0 25 8 35 -2 25 6 35 -2"/></svg>
    </div>
    <div class="cat-grid" data-list="categories"></div>
  </div>
</section>

<!-- ===================== PRODUCTS ===================== -->
<section class="products" id="crochet">
  <div class="wrap">
    <div class="sec-head">
      <span class="eyebrow" data-bind="productsSection.eyebrow"></span>
      <h2 data-bind="productsSection.heading"></h2>
      <svg class="ribbon-underline" viewBox="0 0 150 14"><path d="M2 8c15 -12 30 8 40 -2s25 -10 35 0 25 8 35 -2 25 6 35 -2"/></svg>
    </div>
    <div class="product-grid" data-list="products"></div>
  </div>
</section>

<!-- ===================== PROMO ===================== -->
<section class="promo" id="custom">
  <div class="wrap">
    <div class="promo-text">
      <span class="eyebrow" data-bind="promo.eyebrow"></span>
      <h2 data-bind="promo.heading"></h2>
      <p data-bind="promo.body"></p>
      <a href="#" class="btn" style="background:var(--midnight); border-color:var(--midnight);" data-bind="promo.ctaText" data-bind-href="promo.ctaHref"></a>
    </div>
    <div class="promo-art">
      <svg viewBox="0 0 300 300" fill="none">
        <circle cx="150" cy="150" r="110" fill="#FFF7E6" opacity="0.4"/>
        <path d="M150 60 C 200 60 230 100 230 150 C 230 210 190 240 150 240 C 110 240 70 210 70 150 C 70 100 100 60 150 60Z" stroke="#2D3A47" stroke-width="3" stroke-dasharray="3 8" fill="none"/>
        <path d="M110 150 q40 -50 80 0 q-40 50 -80 0Z" fill="#B46A72" opacity="0.8"/>
        <circle cx="150" cy="150" r="8" fill="#FFF7E6"/>
      </svg>
    </div>
  </div>
</section>

<!-- ===================== NEWSLETTER ===================== -->
<section class="newsletter" id="about">
  <div class="wrap">
    <span class="eyebrow" style="color:var(--blush);" data-bind="newsletter.eyebrow"></span>
    <h2 data-bind="newsletter.heading"></h2>
    <p data-bind="newsletter.body"></p>
    <div class="news-form">
      <input type="email" data-bind-placeholder="newsletter.placeholder">
      <a href="#" class="btn" data-bind="newsletter.ctaText"></a>
    </div>
  </div>
</section>

<!-- ===================== FOOTER ===================== -->
<footer>
  <div class="wrap">
    <div class="foot-grid">
      <div>
        <div class="foot-logo" data-bind="site.brandName"></div>
        <p data-bind="site.footerTagline"></p>
        <div class="foot-socials" style="margin-top:20px;">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/></svg>
        </div>
      </div>
      <div style="display:contents;" data-list="footer-columns"></div>
    </div>
    <div class="foot-bottom">
      <span>&copy; <span data-bind="site.copyrightText"></span></span>
      <div class="foot-legal" data-list="legal-links"></div>
    </div>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
